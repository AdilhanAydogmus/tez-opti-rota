services:
  - type: web
    name: tez-web-arayuz
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: tez-db        # Render'daki database servisinin adı
          property: connectionString

databases:
  - name: tez-db
    databaseName: tez_app
    plan: free
